<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consul.ty | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page">
        <nav class="top-nav" aria-label="Main navigation">
            <a href="landing.html">Home</a>
            <a href="#credits">Credits</a>
            <a class="social-link" href="#" aria-label="X">X</a>
            <a class="social-link social-facebook" href="#" aria-label="Facebook">f</a>
            <a class="social-link social-instagram" href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle class="instagram-dot" cx="17.5" cy="6.5" r="1"></circle>
                </svg>
            </a>
            <a class="signup-button" href="create.html">Sign Up</a>
        </nav>

        <section class="login-wrap" aria-label="Login form section">
            <img class="chat-icon" src="images/consultylogo.png" alt="Consul.ty logo" />

            <form class="login-card" action="#" method="post">
                <h1>Log in to your Account</h1>

                <div class="field">
                    <label class="visually-hidden" for="username">Email</label>
                    <input type="email" id="username" name="username" placeholder="Enter Email" autocomplete="email"
                        required />
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
                            class="icon-cutout"></path>
                        <path d="M5.5 7.5 12 12.5l6.5-5" class="icon-cutout"></path>
                    </svg>
                </div>

                <div class="field">
                    <label class="visually-hidden" for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password"
                        autocomplete="current-password" required />
                    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7.5 11V8.8A4.5 4.5 0 0 1 12 4.5a4.5 4.5 0 0 1 4.5 4.3V11" class="icon-cutout"></path>
                        <rect x="5" y="11" width="14" height="8.5" rx="1.8" class="icon-cutout"></rect>
                        <path d="M12 15.5v2.2" class="icon-cutout"></path>
                    </svg>
                </div>

                <button type="submit" class="btn-login">Log In</button>
                <a class="forgot-link" href="#forgot-password">Forgot Password?</a>
            </form>
        </section>

        <footer class="footer">
            <nav class="footer-links" aria-label="Footer navigation">
                <a href="#contact">Contact Us</a>
                <a href="#about">About Us</a>
                <a href="#faq">FAQ</a>
            </nav>
            <p id="credits">© 2026 - (Consul.ty) - Faculty Consultation by Claudee, Crizzy, and Paul</p>
        </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>

</html>
