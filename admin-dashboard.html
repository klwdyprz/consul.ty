<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consul.ty | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="my-tickets.css" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="notifications.css" />
</head>

<body class="dashboard">
    <div class="dash-top">
        <header class="dash-header">
            <a class="dash-brand" href="admin-dashboard.html" aria-label="Consul.ty home">
                <img src="images/consultylogo.png" alt="" />
                <span>Consul.<b>ty</b></span>
            </a>

            <nav class="dash-nav" aria-label="Main navigation">
                <a class="is-active" aria-current="page" href="admin-dashboard.html">Dashboard</a>
                <a href="admin-consultations.html">Consultations</a>
            </nav>

            <button type="button" class="dash-user adm-logout" id="logout-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"></path><path d="M16 8l4 4-4 4M20 12H9"></path></svg>
                Log Out
            </button>
        </header>

        <section class="dash-hero adm-hero" aria-labelledby="announce-heading">
            <div class="dash-appointment adm-announce">
                <div class="adm-announce-head">
                    <h1 id="announce-heading">Current system announcement:</h1>
                    <button type="button" class="adm-switch" id="announce-switch" role="switch"
                        aria-checked="false" aria-label="Show announcement to users"></button>
                </div>

                <div class="adm-announce-box" id="announce-box">
                    <button type="button" class="adm-edit" id="announce-edit">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1Z"></path></svg>
                        Edit
                    </button>
                    <p id="announce-text">No announcement yet.</p>
                    <form class="adm-form" id="announce-form" hidden>
                        <label class="visually-hidden" for="announce-input">Announcement text</label>
                        <textarea id="announce-input" maxlength="500" placeholder="Write an announcement for all users..."></textarea>
                        <div class="adm-form-actions">
                            <button type="button" id="announce-cancel">Cancel</button>
                            <button type="submit" class="is-primary">Save</button>
                        </div>
                    </form>
                </div>
                <p class="adm-note" id="announce-note" role="status" hidden></p>
            </div>
        </section>
    </div>

    <main class="dash-stats adm-stats">
        <section class="dash-card" aria-labelledby="weekly-heading">
            <h2 id="weekly-heading">Weekly consultations <b id="weekly-total">0</b></h2>
            <ul class="dash-rows" id="weekly-rows"></ul>
        </section>

        <section class="dash-card" aria-labelledby="dept-heading">
            <h2 id="dept-heading">Tickets by department</h2>
            <div class="adm-donut-wrap">
                <div class="adm-donut" id="donut" role="img" aria-label="Tickets by department">
                    <div class="adm-donut-total"><strong id="donut-total">0</strong><span>tickets</span></div>
                </div>
                <ul class="adm-legend" id="legend"></ul>
            </div>
        </section>
    </main>

    <footer class="footer dash-footer">
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="#contact">Contact Us</a>
            <a href="#about">About Us</a>
            <a href="#faq">FAQ</a>
        </nav>
        <p id="credits">© 2026 - (Consul.ty) - Faculty Consultation by Claudee, Crizzy, and Paul</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="admin-db.js"></script>
    <script src="notifications.js"></script>
    <script src="prof-nav.js"></script>
    <script src="admin-dashboard.js"></script>
</body>

</html>
