    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="my-tickets.css" />
    <link rel="stylesheet" href="admin.css" />

<body class="dashboard">
    <div class="dash-top">
        <header class="dash-header">
            <a class="dash-brand" href="admin-dashboard.html" aria-label="Consul.ty home">
                <img src="images/consultylogo.png" alt="" />
                <span>Consul.<b>ty</b></span>
            </a>

            <nav class="dash-nav" aria-label="Main navigation">
                <a href="admin-dashboard.html">Dashboard</a>
                <a class="is-active" aria-current="page" href="admin-consultations.html">Consultations</a>
            </nav>

            <button type="button" class="dash-user adm-logout" id="logout-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"></path><path d="M16 8l4 4-4 4M20 12H9"></path></svg>
                Log Out
            </button>
        </header>

        <section class="adm-search-hero">
            <div class="adm-search">
                <label class="visually-hidden" for="admin-search">Search consultations</label>
                <input type="search" id="admin-search" placeholder="Search" autocomplete="off" />
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <path d="m15.5 15.5 5 5"></path>
                </svg>
            </div>
        </section>
    </div>

    <main class="adm-results">
        <h2>Result:</h2>
        <ul class="adm-list" id="admin-list"></ul>
        <p class="tk-reply-note" id="export-note" role="status" hidden></p>
    </main>

    <footer class="footer dash-footer">
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="#contact">Contact Us</a>
            <a href="#about">About Us</a>
            <a href="#faq">FAQ</a>
        </nav>
        <p id="credits">© 2026 - (Consul.ty) - Faculty Consultation by Claudee, Crizzy, and Paul</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

    <script src="admin-db.js"></script>
    <script src="notifications.js"></script>
    <script src="prof-nav.js"></script>
    <script src="admin-consultations.js"></script>
