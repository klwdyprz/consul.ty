<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consul.ty | Schedules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="schedules.css" />
    <link rel="stylesheet" href="notifications.css" />
</head>

<body class="dashboard schedules">
    <div class="dash-top">
        <header class="dash-header">
            <a class="dash-brand" href="dashboard.html" aria-label="Consul.ty home">
                <img src="images/consultylogo.png" alt="" />
                <span>Consul.<b>ty</b></span>
            </a>

            <nav class="dash-nav" aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>

                <div class="dash-dropdown">
                    <button type="button" class="dash-dropdown-toggle" aria-expanded="false"
                        aria-controls="consultations-menu">
                        Consultations
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 9 7 7 7-7"></path>
                        </svg>
                    </button>
                    <ul class="dash-dropdown-menu" id="consultations-menu" hidden>
                        <li><a href="submit-ticket.html">Submit A Consultation Ticket</a></li>
                        <li><a href="my-tickets.html">View my Tickets</a></li>
                    </ul>
                </div>

                <a class="is-active" href="schedules.html" aria-current="page">Schedules</a>
            </nav>

            <a class="dash-user" href="profile.html" title="View profile">
                <span class="dash-avatar" id="user-avatar"></span>
                <span id="user-name">username</span>
            </a>
        </header>

        <section class="dash-hero" aria-labelledby="appointment-heading">
            <div class="dash-appointment">
                <h1 id="appointment-heading">You have an upcoming appointment on</h1>
                <div class="dash-date" role="group" aria-label="Appointment date">
                    <div class="dash-date-tile is-empty" id="appt-month">MM</div>
                    <span class="dash-date-slash" aria-hidden="true">/</span>
                    <div class="dash-date-tile is-empty" id="appt-day">DD</div>
                    <span class="dash-date-slash" aria-hidden="true">/</span>
                    <div class="dash-date-tile is-empty" id="appt-year">YY</div>
                </div>
            </div>
        </section>
    </div>

    <main class="sch-main">
        <h2 class="sch-title">My Schedules:</h2>
        <ul class="sch-list" id="schedule-list"></ul>
    </main>

    <footer class="footer dash-footer">
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="#contact">Contact Us</a>
            <a href="#about">About Us</a>
            <a href="#faq">FAQ</a>
        </nav>
        <p id="credits">© 2026 - (Consul.ty) - Faculty Consultation by Claudee, Crizzy, and Paul</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="notifications.js"></script>
    <script src="schedules.js"></script>
</body>

</html>
