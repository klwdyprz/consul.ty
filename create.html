<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consul.ty | Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signup.css" />
</head>

<body>
    <main class="page">
        <nav class="top-nav" aria-label="Main navigation">
            <a href="landing.html">Home</a>
            <a href="#credits">Credits</a>
            <a class="social-link" href="#" aria-label="X">X</a>
            <a class="social-link social-facebook" href="#" aria-label="Facebook">f</a>
            <a class="social-link social-instagram" href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle class="instagram-dot" cx="17.5" cy="6.5" r="1"></circle>
                </svg>
            </a>
            <a class="signin-button" href="login.html">Sign In</a>
        </nav>

        <section class="login-wrap" aria-label="Create account form section">
            <img class="chat-icon" src="images/consultylogo.png" alt="Consul.ty logo" />

            <form class="auth-card signup-card" action="#" method="post">
                <h1>Create Account</h1>

                <div class="signup-grid">
                    <div class="signup-col">
                        <div class="field">
                            <label class="visually-hidden" for="signup-last-name">Last Name</label>
                            <input type="text" id="signup-last-name" name="last_name" placeholder="Enter Last Name"
                                autocomplete="family-name" required />
                        </div>

                        <div class="field">
                            <label class="visually-hidden" for="signup-first-name">First Name</label>
                            <input type="text" id="signup-first-name" name="first_name" placeholder="Enter First Name"
                                autocomplete="given-name" required />
                        </div>

                        <div class="field">
                            <label class="visually-hidden" for="signup-middle-initial">Middle Initial</label>
                            <input type="text" id="signup-middle-initial" name="middle_initial"
                                placeholder="Enter Middle Initial" autocomplete="additional-name" maxlength="3" />
                        </div>
                    </div>

                    <div class="signup-col">
                        <div class="field">
                            <label class="visually-hidden" for="signup-email">Email</label>
                            <input type="email" id="signup-email" name="email" placeholder="Enter Email"
                                autocomplete="email" required />
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
                                    class="icon-cutout"></path>
                                <path d="M5.5 7.5 12 12.5l6.5-5" class="icon-cutout"></path>
                            </svg>
                        </div>

                        <div class="field">
                            <label class="visually-hidden" for="signup-password">Password</label>
                            <input type="password" id="signup-password" name="password" placeholder="Enter Password"
                                autocomplete="new-password" minlength="6" required />
                            <button type="button" class="field-toggle" aria-label="Show password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path class="eye-slash" d="M4 4l16 16"></path>
                                </svg>
                            </button>
                        </div>

                        <div class="field">
                            <label class="visually-hidden" for="signup-confirm-password">Re-enter Password</label>
                            <input type="password" id="signup-confirm-password" name="confirm_password"
                                placeholder="Re-enter Password" autocomplete="new-password"
                                aria-describedby="password-match-error" required />
                            <button type="button" class="field-toggle" aria-label="Show password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path class="eye-slash" d="M4 4l16 16"></path>
                                </svg>
                            </button>
                        </div>
                        <p class="field-error" id="password-match-error" aria-live="polite" hidden>Passwords do not match.</p>
                    </div>
                </div>

                <button type="submit" class="btn-signup">Sign Up</button>
            </form>
        </section>

        <footer class="footer">
            <nav class="footer-links" aria-label="Footer navigation">
                <a href="#contact">Contact Us</a>
                <a href="#about">About Us</a>
                <a href="#faq">FAQ</a>
            </nav>
            <p id="credits">© 2026 - (Consul.ty) - Faculty Consultation by Claudee, Crizzy, and Paul</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>

</html>
